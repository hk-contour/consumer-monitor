name: monitor

on:
  # Scheduled cron disabled while iterating on signal quality. Re-enable
  # by uncommenting the two cron strings below.
  # schedule:
  #   - cron: '6 11,13,15,17,19,21,23 * * 1-5'   # high tier every 2h weekdays
  #   - cron: '6 11 * * 1-5'                     # all tiers once daily at 11:06 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to run (ignored if tickers is set)'
        required: false
        default: 'high'
        type: choice
        options: [high, medium, all]
      tickers:
        description: 'Optional comma-separated tickers (e.g. SHOP,WIX,DASH,CART). Overrides tier.'
        required: false
        type: string

permissions:
  contents: write   # need to commit snapshots + updated xlsx back

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide run args
        id: args
        run: |
          if [ -n "${{ inputs.tickers }}" ]; then
            echo "mode=tickers" >> "$GITHUB_OUTPUT"
            echo "value=${{ inputs.tickers }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tier }}" ]; then
            echo "mode=tier" >> "$GITHUB_OUTPUT"
            echo "value=${{ inputs.tier }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "6 11,13,15,17,19,21,23 * * 1-5" ]; then
            HOUR=$(date -u +%H)
            echo "mode=tier" >> "$GITHUB_OUTPUT"
            if [ "$HOUR" = "11" ]; then
              echo "value=all" >> "$GITHUB_OUTPUT"
            else
              echo "value=high" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=tier" >> "$GITHUB_OUTPUT"
            echo "value=high" >> "$GITHUB_OUTPUT"
          fi

      - name: LLM smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python tools/test_llm.py

      - name: Run monitor (${{ steps.args.outputs.mode }}=${{ steps.args.outputs.value }})
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          if [ "${{ steps.args.outputs.mode }}" = "tickers" ]; then
            python run.py --ticker "${{ steps.args.outputs.value }}"
          else
            python run.py --tier "${{ steps.args.outputs.value }}"
          fi

      - name: Commit snapshots and digest
        run: |
          git config user.name  "consumer-monitor-bot"
          git config user.email "consumer-monitor-bot@users.noreply.github.com"
          git add snapshots/ monitoring_system/ changelog.jsonl config/company_urls_jc.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "monitor: ${{ steps.args.outputs.mode }}=${{ steps.args.outputs.value }} run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
