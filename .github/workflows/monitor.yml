name: monitor

on:
  schedule:
    # Weekday mornings — scrapes both analysts' coverage and emails each their
    # own digest. 11:30 UTC ≈ 7:30am ET (EDT). GitHub may delay cron a few
    # minutes under load. Change the time by editing this one line.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      analyst:
        description: "Run one analyst's list (1/2), or 'both' to dry-run the full scheduled two-email path."
        required: false
        type: choice
        options: ['', '1', '2', 'both']
        default: ''
      tier:
        description: 'Tier to run (ignored if analyst/tickers is set)'
        required: false
        default: 'high'
        type: choice
        options: [high, medium, all]
      tickers:
        description: 'Optional comma-separated tickers (e.g. SHOP,WIX,DASH). Overrides tier + analyst.'
        required: false
        type: string
      send_email:
        description: 'Email the digest after a manual run (goes to EMAIL_TO)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # need to commit snapshots + updated xlsx back

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: LLM smoke test
        run: python tools/test_llm.py

      # ---------------- Manual dispatch: one targeted run ----------------
      - name: Run monitor (manual)
        id: runm
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyst != 'both' }}
        env:
          IN_TICKERS: ${{ inputs.tickers }}
          IN_ANALYST: ${{ inputs.analyst }}
          IN_TIER: ${{ inputs.tier }}
        run: |
          if [ -n "$IN_TICKERS" ]; then
            python run.py --ticker "$IN_TICKERS"
          elif [ -n "$IN_ANALYST" ]; then
            python run.py --analyst "$IN_ANALYST"
          else
            python run.py --tier "$IN_TIER"
          fi

      - name: Email digest (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyst != 'both' && inputs.send_email == true }}
        continue-on-error: true  # webhook blips should not fail the run
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DIGEST_HTML: ${{ steps.runm.outputs.digest_html }}
        run: python tools/send_digest_email.py

      # ---------- Scheduled: both analysts, each their own email ----------
      - name: Run monitor — Analyst 1
        id: run1
        if: ${{ github.event_name == 'schedule' || inputs.analyst == 'both' }}
        run: python run.py --analyst 1

      - name: Run monitor — Analyst 2
        id: run2
        if: ${{ github.event_name == 'schedule' || inputs.analyst == 'both' }}
        run: python run.py --analyst 2

      - name: Email digest — Analyst 1
        if: ${{ github.event_name == 'schedule' || (inputs.analyst == 'both' && inputs.send_email == true) }}
        continue-on-error: true  # webhook blips should not fail the run
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DIGEST_HTML: ${{ steps.run1.outputs.digest_html }}
        run: python tools/send_digest_email.py

      - name: Email digest — Analyst 2
        if: ${{ github.event_name == 'schedule' || (inputs.analyst == 'both' && inputs.send_email == true) }}
        continue-on-error: true  # webhook blips should not fail the run
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO_2 }}
          DIGEST_HTML: ${{ steps.run2.outputs.digest_html }}
        run: python tools/send_digest_email.py

      # ---------------- Commit everything once ----------------
      # Harden against the two historical reds on this step:
      #   - non-fast-forward when main moved mid-run (Jul 2026)
      #   - intermittent `remote: fatal error in commit_refs` on large
      #     snapshot pushes (Aug 2026; GitHub-side, usually retryable)
      - name: Commit snapshots and digests
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "consumer-monitor-bot"
          git config user.email "consumer-monitor-bot@users.noreply.github.com"
          # Large snapshot packs occasionally trip GitHub's commit_refs path.
          git config http.postBuffer 524288000

          # Only stage what the run actually produces. The xlsx is opened
          # read-only by the scraper and never changes here — staging it added
          # no value and was the one file that could cause an unresolvable
          # BINARY rebase conflict if a human edited it mid-run. Coverage edits
          # to the xlsx are committed by their own tooling, not this workflow.
          git add snapshots/ monitoring_system/ changelog.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "monitor: run $(date -u +%Y-%m-%dT%H:%MZ)"

          # Pull --rebase then push, with retries for races / transient rejects.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}…"
            if ! git fetch origin main; then
              echo "Fetch failed on attempt ${attempt}; sleeping before retry…"
              sleep $((attempt * 15))
              continue
            fi
            if ! git rebase origin/main; then
              echo "Rebase conflict — aborting rebase and failing so a human can look."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; sleeping before retry…"
            sleep $((attempt * 15))
          done
          echo "Push failed after retries."
          exit 1
